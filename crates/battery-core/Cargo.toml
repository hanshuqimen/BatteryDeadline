[package]
name = "battery-deadline-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reversible, deadline-based laptop battery controller"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rusqlite = { version = "0.38", features = ["bundled"] }
fs2 = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Power", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "battery-deadline-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "battery-deadline-preview"
path = "src/bin/preview.rs"
